<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" width="200" height="56" role="img" aria-label="Mistvale Tea Co. logo">
  <title>Mistvale Tea Co.</title>
  <!-- Leaf-hill mark -->
  <g transform="translate(4, 4)">
    <!-- Outer circle background -->
    <circle cx="24" cy="24" r="24" fill="#1f3d2b"/>
    <!-- Hill silhouette -->
    <path d="M8 36 Q16 20 24 18 Q32 20 40 36 Z" fill="#2a5239"/>
    <!-- Leaf shape -->
    <path d="M24 10 C18 14 12 20 14 28 C16 32 20 34 24 34 C28 34 32 32 34 28 C36 20 30 14 24 10 Z" fill="#4f7942"/>
    <!-- Leaf vein -->
    <line x1="24" y1="12" x2="24" y2="32" stroke="#f6f1e7" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <line x1="24" y1="20" x2="20" y2="24" stroke="#f6f1e7" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="24" y1="24" x2="28" y2="28" stroke="#f6f1e7" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <!-- Mist wisps -->
    <path d="M12 38 Q16 36 20 38 Q24 36 28 38 Q32 36 36 38" stroke="#f6f1e7" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M14 41 Q18 39 22 41 Q26 39 30 41 Q34 39 38 41" stroke="#f6f1e7" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1f3d2b" letter-spacing="-0.5">Mistvale</text>
  <text x="63" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#4f7942" letter-spacing="2.5" font-weight="400">TEA CO.</text>
</svg>
