<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Assam Breakfast Black Tea — kraft paper pack on wooden surface">
  <title>Assam Breakfast Black Tea</title>
  <!-- Background: warm linen -->
  <rect width="400" height="400" fill="#e8dfc8"/>
  <!-- Subtle texture lines -->
  <line x1="0" y1="80" x2="400" y2="80" stroke="#d4c9ae" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#d4c9ae" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#d4c9ae" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="320" x2="400" y2="320" stroke="#d4c9ae" stroke-width="0.5" opacity="0.5"/>
  <!-- Wooden surface shadow -->
  <ellipse cx="200" cy="360" rx="110" ry="18" fill="#c4b898" opacity="0.5"/>
  <!-- Tea pack body (kraft paper) -->
  <rect x="110" y="80" width="180" height="260" rx="12" fill="#c8a96e"/>
  <rect x="110" y="80" width="180" height="260" rx="12" fill="none" stroke="#a08040" stroke-width="2"/>
  <!-- Pack top fold -->
  <path d="M110 110 L200 95 L290 110 L290 80 Q200 68 110 80 Z" fill="#b89448" stroke="#a08040" stroke-width="1.5"/>
  <!-- Label area (cream) -->
  <rect x="128" y="130" width="144" height="170" rx="8" fill="#f6f1e7"/>
  <rect x="128" y="130" width="144" height="170" rx="8" fill="none" stroke="#d4c9ae" stroke-width="1.5"/>
  <!-- Green accent stripe on label -->
  <rect x="128" y="130" width="144" height="22" rx="8" fill="#1f3d2b"/>
  <rect x="128" y="143" width="144" height="9" fill="#1f3d2b"/>
  <!-- Label text area - tea name  -->
  <text x="200" y="175" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#1f3d2b" text-anchor="middle" letter-spacing="1">ASSAM</text>
  <text x="200" y="192" font-family="Georgia, serif" font-size="10" fill="#4f7942" text-anchor="middle" letter-spacing="1.5">BREAKFAST</text>
  <text x="200" y="207" font-family="Georgia, serif" font-size="9" fill="#888" text-anchor="middle" letter-spacing="1">BLACK TEA</text>
  <!-- Horizontal divider -->
  <line x1="144" y1="216" x2="256" y2="216" stroke="#d4c9ae" stroke-width="1"/>
  <!-- Tea leaves illustration -->
  <ellipse cx="180" cy="250" rx="14" ry="7" fill="#4f7942" transform="rotate(-30 180 250)"/>
  <ellipse cx="200" cy="242" rx="16" ry="7" fill="#3a6332" transform="rotate(5 200 242)"/>
  <ellipse cx="220" cy="252" rx="13" ry="6" fill="#4f7942" transform="rotate(25 220 252)"/>
  <ellipse cx="195" cy="262" rx="12" ry="5" fill="#2a4a22" transform="rotate(-10 195 262)"/>
  <!-- Weight label -->
  <text x="200" y="288" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">100 g</text>
  <!-- Mistvale branding on pack -->
  <text x="200" y="106" font-family="Georgia, serif" font-size="9" fill="#f6f1e7" text-anchor="middle" letter-spacing="2" opacity="0.9">MISTVALE TEA CO.</text>
  <!-- Tea cup icon hint -->
  <path d="M185 330 Q185 345 200 348 Q215 345 215 330 Z" fill="#8B4513" opacity="0.25"/>
  <path d="M183 330 L217 330" stroke="#8B4513" stroke-width="1.5" opacity="0.3"/>
</svg>
