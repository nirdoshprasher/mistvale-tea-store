<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Hibiscus Rose Infusion — deep ruby pouch with flowers">
  <title>Hibiscus Rose Infusion</title>
  <!-- Background: muted dusty rose stone -->
  <rect width="400" height="400" fill="#e8dcd4"/>
  <circle cx="320" cy="80" r="100" fill="#d4b0a0" opacity="0.2"/>
  <!-- Sold-out subtle overlay -->
  <rect width="400" height="400" fill="#888" opacity="0.06"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="358" rx="106" ry="15" fill="#b09888" opacity="0.4"/>
  <!-- Pouch — deep ruby/burgundy -->
  <rect x="124" y="100" width="152" height="228" rx="12" fill="#7a1a30"/>
  <rect x="128" y="104" width="50" height="220" rx="8" fill="#8a2538" opacity="0.5"/>
  <!-- Top seal -->
  <rect x="134" y="94" width="132" height="14" rx="7" fill="#5a0f20"/>
  <!-- Gusset -->
  <path d="M134 308 Q134 336 160 336 L240 336 Q266 336 266 308 Z" fill="#5a0f20"/>
  <!-- Hibiscus flower (large, centre of pouch) -->
  <!-- Petals -->
  <ellipse cx="200" cy="170" rx="22" ry="40" fill="#c0294a" opacity="0.85"/>
  <ellipse cx="200" cy="170" rx="22" ry="40" fill="#c0294a" opacity="0.85" transform="rotate(72 200 170)"/>
  <ellipse cx="200" cy="170" rx="22" ry="40" fill="#c0294a" opacity="0.85" transform="rotate(144 200 170)"/>
  <ellipse cx="200" cy="170" rx="22" ry="40" fill="#c0294a" opacity="0.85" transform="rotate(216 200 170)"/>
  <ellipse cx="200" cy="170" rx="22" ry="40" fill="#c0294a" opacity="0.85" transform="rotate(288 200 170)"/>
  <!-- Flower centre -->
  <circle cx="200" cy="170" r="12" fill="#8a0028"/>
  <circle cx="200" cy="170" r="6" fill="#d9962b"/>
  <!-- Rose petals (smaller, side) -->
  <ellipse cx="155" cy="250" rx="14" ry="10" fill="#b8203a" opacity="0.7" transform="rotate(-20 155 250)"/>
  <ellipse cx="157" cy="240" rx="12" ry="9" fill="#c03050" opacity="0.65" transform="rotate(-35 157 240)"/>
  <ellipse cx="245" cy="248" rx="14" ry="10" fill="#b8203a" opacity="0.7" transform="rotate(20 245 248)"/>
  <ellipse cx="243" cy="238" rx="12" ry="9" fill="#c03050" opacity="0.65" transform="rotate(35 243 238)"/>
  <!-- Label panel -->
  <rect x="132" y="272" width="136" height="56" rx="8" fill="#f6f1e7" opacity="0.92"/>
  <text x="200" y="291" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#7a1a30" text-anchor="middle">HIBISCUS ROSE</text>
  <text x="200" y="307" font-family="Georgia, serif" font-size="9" fill="#4f7942" text-anchor="middle" letter-spacing="1">INFUSION</text>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="9" fill="#b3261e" font-weight="600" text-anchor="middle">Out of stock</text>
  <!-- Top brand text -->
  <text x="200" y="112" font-family="Arial, sans-serif" font-size="8" fill="#f6f1e7" text-anchor="middle" letter-spacing="1.5" opacity="0.75">MISTVALE TEA CO.</text>
  <!-- Sold out diagonal band -->
  <rect x="124" y="100" width="152" height="228" rx="12" fill="none" stroke="#d4b0a0" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>
</svg>
