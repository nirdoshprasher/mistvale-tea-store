<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Mist rising over a lush green tea garden at dawn">
  <title>Mistvale Tea Gardens at dawn</title>
  <defs>
    <!-- Sky gradient: dawn -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a38"/>
      <stop offset="40%" stop-color="#4a7a5a"/>
      <stop offset="70%" stop-color="#7aaa80"/>
      <stop offset="100%" stop-color="#a8c898"/>
    </linearGradient>
    <!-- Mist gradient -->
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f1e7" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#f6f1e7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f6f1e7" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Ground haze -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4e8c4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c8ddb8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="600" fill="url(#sky)"/>
  <!-- Sun glow (right side, behind hills) -->
  <circle cx="950" cy="260" r="80" fill="#d9962b" opacity="0.18"/>
  <circle cx="950" cy="260" r="50" fill="#e8b040" opacity="0.14"/>
  <circle cx="950" cy="260" r="28" fill="#f0c858" opacity="0.2"/>
  <!-- Distant mountain range -->
  <path d="M0 350 Q200 260 400 300 Q500 270 600 290 Q700 260 850 280 Q1000 250 1200 290 L1200 600 L0 600 Z" fill="#1f3d2b" opacity="0.85"/>
  <!-- Mid hills -->
  <path d="M0 380 Q150 320 300 350 Q450 310 600 340 Q750 310 900 340 Q1050 315 1200 345 L1200 600 L0 600 Z" fill="#2a5239" opacity="0.9"/>
  <!-- Tea rows — near hills -->
  <path d="M0 420 Q200 390 400 410 Q600 390 800 415 Q1000 395 1200 418 L1200 600 L0 600 Z" fill="#3a6832"/>
  <!-- Tea plant rows (undulating hedge shapes) -->
  <!-- Row 1 -->
  <path d="M0 435 Q30 428 60 435 Q90 428 120 435 Q150 428 180 435 Q210 428 240 435 Q270 428 300 435 Q330 428 360 435 Q390 428 420 435 Q450 428 480 435 Q510 428 540 435 Q570 428 600 435 Q630 428 660 435 Q690 428 720 435 Q750 428 780 435 Q810 428 840 435 Q870 428 900 435 Q930 428 960 435 Q990 428 1020 435 Q1050 428 1080 435 Q1110 428 1140 435 Q1170 428 1200 435 L1200 445 Q1170 452 1140 445 Q1110 452 1080 445 Q1050 452 1020 445 Q990 452 960 445 Q930 452 900 445 Q870 452 840 445 Q810 452 780 445 Q750 452 720 445 Q690 452 660 445 Q630 452 600 445 Q570 452 540 445 Q510 452 480 445 Q450 452 420 445 Q390 452 360 445 Q330 452 300 445 Q270 452 240 445 Q210 452 180 445 Q150 452 120 445 Q90 452 60 445 Q30 452 0 445 Z" fill="#4f7942"/>
  <!-- Row 2 -->
  <path d="M0 462 Q40 454 80 462 Q120 454 160 462 Q200 454 240 462 Q280 454 320 462 Q360 454 400 462 Q440 454 480 462 Q520 454 560 462 Q600 454 640 462 Q680 454 720 462 Q760 454 800 462 Q840 454 880 462 Q920 454 960 462 Q1000 454 1040 462 Q1080 454 1120 462 Q1160 454 1200 462 L1200 474 Q1160 482 1120 474 Q1080 482 1040 474 Q1000 482 960 474 Q920 482 880 474 Q840 482 800 474 Q760 482 720 474 Q680 482 640 474 Q600 482 560 474 Q520 482 480 474 Q440 482 400 474 Q360 482 320 474 Q280 482 240 474 Q200 482 160 474 Q120 482 80 474 Q40 482 0 474 Z" fill="#4a7040"/>
  <!-- Row 3 -->
  <path d="M0 492 Q50 482 100 492 Q150 482 200 492 Q250 482 300 492 Q350 482 400 492 Q450 482 500 492 Q550 482 600 492 Q650 482 700 492 Q750 482 800 492 Q850 482 900 492 Q950 482 1000 492 Q1050 482 1100 492 Q1150 482 1200 492 L1200 506 Q1150 518 1100 506 Q1050 518 1000 506 Q950 518 900 506 Q850 518 800 506 Q750 518 700 506 Q650 518 600 506 Q550 518 500 506 Q450 518 400 506 Q350 518 300 506 Q250 518 200 506 Q150 518 100 506 Q50 518 0 506 Z" fill="#538848"/>
  <!-- Ground fill -->
  <rect x="0" y="510" width="1200" height="90" fill="#3a6832"/>
  <!-- Mist layer over garden -->
  <rect width="1200" height="600" fill="url(#mist)"/>
  <!-- Mist wisps at ground level -->
  <ellipse cx="300" cy="440" rx="200" ry="30" fill="#f6f1e7" opacity="0.22"/>
  <ellipse cx="700" cy="450" rx="250" ry="28" fill="#f6f1e7" opacity="0.18"/>
  <ellipse cx="1000" cy="435" rx="180" ry="24" fill="#f6f1e7" opacity="0.15"/>
  <ellipse cx="150" cy="480" rx="160" ry="20" fill="#f6f1e7" opacity="0.15"/>
  <ellipse cx="900" cy="480" rx="200" ry="22" fill="#f6f1e7" opacity="0.12"/>
  <!-- Birds (simple V shapes, distant) -->
  <path d="M820 180 Q828 176 836 180" stroke="#1f3d2b" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M846 172 Q854 168 862 172" stroke="#1f3d2b" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M870 184 Q876 180 882 184" stroke="#1f3d2b" stroke-width="1.5" fill="none" opacity="0.35"/>
  <!-- Tea picker silhouette (distant, right side) -->
  <ellipse cx="880" cy="418" rx="8" ry="14" fill="#1a3020" opacity="0.6"/>
  <circle cx="880" cy="400" r="5" fill="#1a3020" opacity="0.6"/>
  <!-- Basket on back -->
  <ellipse cx="886" cy="407" rx="6" ry="8" fill="#2a4028" opacity="0.55"/>
  <!-- Second picker -->
  <ellipse cx="920" cy="422" rx="7" ry="12" fill="#1a3020" opacity="0.5"/>
  <circle cx="920" cy="406" r="4.5" fill="#1a3020" opacity="0.5"/>
  <!-- Foreground dark vignette -->
  <linearGradient id="fgvign" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#0a1a0f" stop-opacity="0.5"/>
    <stop offset="35%" stop-color="#0a1a0f" stop-opacity="0"/>
  </linearGradient>
  <rect width="1200" height="600" fill="url(#fgvign)"/>
  <!-- Left dark overlay for text legibility -->
  <linearGradient id="textover" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0a1a0f" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#0a1a0f" stop-opacity="0"/>
  </linearGradient>
  <rect width="1200" height="600" fill="url(#textover)"/>
</svg>
