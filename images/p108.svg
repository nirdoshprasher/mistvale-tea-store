<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Tea Lover's Sampler Gift Box — wooden gift box with six mini tins">
  <title>Tea Lover's Sampler Gift Box</title>
  <!-- Background: warm wood tone -->
  <rect width="400" height="400" fill="#e0d0b0"/>
  <!-- Wood grain lines -->
  <line x1="0" y1="120" x2="400" y2="120" stroke="#cebf98" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#cebf98" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#cebf98" stroke-width="0.4" opacity="0.3"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="362" rx="130" ry="18" fill="#a09070" opacity="0.45"/>
  <!-- Box lid shadow -->
  <rect x="88" y="210" width="224" height="8" rx="4" fill="#806840" opacity="0.4"/>
  <!-- Wooden gift box body (open) -->
  <!-- Box base -->
  <rect x="88" y="218" width="224" height="140" rx="6" fill="#a07840"/>
  <rect x="88" y="218" width="224" height="140" rx="6" fill="none" stroke="#7a5828" stroke-width="2"/>
  <!-- Wood grain on box face -->
  <line x1="92" y1="240" x2="308" y2="240" stroke="#8a6830" stroke-width="0.8" opacity="0.4"/>
  <line x1="92" y1="268" x2="308" y2="268" stroke="#8a6830" stroke-width="0.8" opacity="0.35"/>
  <line x1="92" y1="296" x2="308" y2="296" stroke="#8a6830" stroke-width="0.8" opacity="0.3"/>
  <!-- Box inside (dark linen) -->
  <rect x="96" y="226" width="208" height="125" rx="4" fill="#2a1f10"/>
  <!-- 6 mini tins (2 rows × 3) — colourful sampler -->
  <!-- Row 1 -->
  <!-- Tin 1: black (Assam) -->
  <rect x="104" y="232" width="58" height="50" rx="5" fill="#4a3020"/>
  <rect x="108" y="236" width="50" height="40" rx="3" fill="#5a3828"/>
  <text x="133" y="256" font-family="Arial" font-size="7" fill="#d9962b" text-anchor="middle" font-weight="700">ASSAM</text>
  <rect x="108" y="260" width="50" height="8" rx="2" fill="#d9962b" opacity="0.8"/>
  <!-- Tin 2: gold (Darjeeling) -->
  <rect x="171" y="232" width="58" height="50" rx="5" fill="#8a7020"/>
  <rect x="175" y="236" width="50" height="40" rx="3" fill="#9a8030"/>
  <text x="200" y="256" font-family="Arial" font-size="7" fill="#f6f1e7" text-anchor="middle" font-weight="700">DARJ.</text>
  <rect x="175" y="260" width="50" height="8" rx="2" fill="#d9962b" opacity="0.8"/>
  <!-- Tin 3: dark green (Masala) -->
  <rect x="238" y="232" width="58" height="50" rx="5" fill="#1f3d2b"/>
  <rect x="242" y="236" width="50" height="40" rx="3" fill="#2a5239"/>
  <text x="267" y="256" font-family="Arial" font-size="7" fill="#f6f1e7" text-anchor="middle" font-weight="700">MASALA</text>
  <rect x="242" y="260" width="50" height="8" rx="2" fill="#d9962b" opacity="0.8"/>
  <!-- Row 2 -->
  <!-- Tin 4: sage green (Nilgiri) -->
  <rect x="104" y="290" width="58" height="50" rx="5" fill="#4a7040"/>
  <rect x="108" y="294" width="50" height="40" rx="3" fill="#5a8050"/>
  <text x="133" y="314" font-family="Arial" font-size="7" fill="#f6f1e7" text-anchor="middle" font-weight="700">NILGIRI</text>
  <rect x="108" y="318" width="50" height="8" rx="2" fill="#d9962b" opacity="0.7"/>
  <!-- Tin 5: white/cream (Chamomile) -->
  <rect x="171" y="290" width="58" height="50" rx="5" fill="#e0d8c0"/>
  <rect x="175" y="294" width="50" height="40" rx="3" fill="#ece8d0"/>
  <text x="200" y="314" font-family="Arial" font-size="6.5" fill="#1f3d2b" text-anchor="middle" font-weight="700">CHAMOMILE</text>
  <rect x="175" y="318" width="50" height="8" rx="2" fill="#4f7942" opacity="0.8"/>
  <!-- Tin 6: deep red (Kahwa) -->
  <rect x="238" y="290" width="58" height="50" rx="5" fill="#6a1828"/>
  <rect x="242" y="294" width="50" height="40" rx="3" fill="#7a2030"/>
  <text x="267" y="314" font-family="Arial" font-size="7" fill="#f6f1e7" text-anchor="middle" font-weight="700">KAHWA</text>
  <rect x="242" y="318" width="50" height="8" rx="2" fill="#d9962b" opacity="0.7"/>
  <!-- Box lid (slightly open/leaning) -->
  <rect x="90" y="80" width="220" height="136" rx="8" fill="#b88840"/>
  <rect x="90" y="80" width="220" height="136" rx="8" fill="none" stroke="#8a6020" stroke-width="2"/>
  <!-- Lid wood grain -->
  <line x1="94" y1="108" x2="306" y2="108" stroke="#9a7230" stroke-width="0.8" opacity="0.4"/>
  <line x1="94" y1="136" x2="306" y2="136" stroke="#9a7230" stroke-width="0.8" opacity="0.35"/>
  <line x1="94" y1="164" x2="306" y2="164" stroke="#9a7230" stroke-width="0.7" opacity="0.3"/>
  <!-- Lid label -->
  <rect x="110" y="92" width="180" height="110" rx="6" fill="#f6f1e7" opacity="0.92"/>
  <!-- Gold border on label -->
  <rect x="114" y="96" width="172" height="102" rx="4" fill="none" stroke="#d9962b" stroke-width="1.5"/>
  <!-- Label content -->
  <text x="200" y="116" font-family="Georgia, serif" font-size="9" fill="#888" text-anchor="middle" letter-spacing="2">MISTVALE TEA CO.</text>
  <text x="200" y="134" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#1f3d2b" text-anchor="middle">Tea Lover's</text>
  <text x="200" y="151" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#1f3d2b" text-anchor="middle">Sampler</text>
  <line x1="126" y1="158" x2="274" y2="158" stroke="#d9962b" stroke-width="1"/>
  <text x="200" y="172" font-family="Arial, sans-serif" font-size="9" fill="#4f7942" text-anchor="middle">6 teas · Wooden gift box</text>
  <text x="200" y="186" font-family="Arial, sans-serif" font-size="9" fill="#888" text-anchor="middle">with brewing guide</text>
  <!-- Hinge suggestion -->
  <circle cx="200" cy="218" r="5" fill="#8a6020"/>
  <circle cx="200" cy="218" r="2" fill="#d9962b"/>
</svg>
